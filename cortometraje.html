.movie-page{
  min-height:calc(100vh - 70px);
  display:grid;
  place-items:center;
  padding:12px 2%;
}

.movie-screen{
  width:min(1600px,100%);
  margin:0 auto;
  border:1px solid var(--line);
  background:#000;
  box-shadow:0 0 45px rgba(57,217,255,.1),0 0 100px rgba(0,0,0,.85);
  position:relative;
}

.movie-screen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border:1px solid rgba(57,217,255,.08);
  z-index:2;
}

.movie-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.movie-frame iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

@media(max-width:650px){
  .movie-page{
    min-height:calc(100vh - 60px);
    padding:6px 1%;
  }

  .movie-screen{
    width:100%;
  }
}
</style>
